[package]
name = "dsh-tauri-shell"
version = "0.1.0"
description = "Tauri desktop shell for DeepSeek Harness (PoC: spawns dsh web sidecar, loads the existing React UI in the OS WebView)"
authors = ["DeepSeek AI"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dsh_tauri_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
